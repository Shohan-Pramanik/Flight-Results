name: FlightResults
options:
  bundleIdPrefix: com.shohanpramanik
  deploymentTarget:
    iOS: "17.0"
targets:
  FlightResults:
    type: application
    platform: iOS
    sources:
      - path: Sources/FlightResults
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.shohanpramanik.FlightResults
        SWIFT_VERSION: 5.0
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETSCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETSCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UISupportedInterfaceOrientations~ipad: >-
          UIInterfaceOrientationPortrait
          UIInterfaceOrientationPortraitUpsideDown
          UIInterfaceOrientationLandscapeLeft
          UIInterfaceOrientationLandscapeRight
        GENERATE_INFOPLIST_FILE: YES
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
schemes:
  FlightResults:
    build:
      targets:
        FlightResults: all
    run:
      config: Debug
    test:
      config: Debug
    archive:
      config: Release
